[project]
name = "medaudit-ai"
version = "0.1.0"
description = "Clinical Document Intelligence and Chronology Synthesizer Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pymupdf>=1.24.0",
    "pydantic>=2.7.0",
    "google-genai>=0.1.1",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"